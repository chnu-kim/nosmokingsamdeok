<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>삼덕이의 금연 챌린지 — 31일</title>
  <meta name="description" content="스트리머 삼덕이의 31일 금연 챌린지. 실패 시 벌칙: 삼루먼쇼" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== Hero ===== -->
  <header class="hero">
    <div class="container">
      <span class="hero__badge" id="hero-badge">챌린지 시작 예정</span>
      <h1 class="hero__title"><em>삼덕이</em>의 금연 챌린지</h1>
      <p class="hero__subtitle">31일, 한 개비도 없이 버텨라.</p>

      <div class="day-counter">
        <div class="day-counter__number" id="day-number">D-Day</div>
        <div class="day-counter__label" id="day-label">곧 시작됩니다</div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ===== 시작 전: 카운트다운 ===== -->
    <section id="view-before" class="countdown">
      <p class="countdown__title">챌린지 시작까지</p>
      <div class="countdown__grid">
        <div class="countdown__item">
          <div class="countdown__value" id="cd-days">00</div>
          <div class="countdown__unit">일</div>
        </div>
        <div class="countdown__item">
          <div class="countdown__value" id="cd-hours">00</div>
          <div class="countdown__unit">시간</div>
        </div>
        <div class="countdown__item">
          <div class="countdown__value" id="cd-minutes">00</div>
          <div class="countdown__unit">분</div>
        </div>
        <div class="countdown__item">
          <div class="countdown__value" id="cd-seconds">00</div>
          <div class="countdown__unit">초</div>
        </div>
      </div>
    </section>

    <!-- ===== 진행 중: 진행률 ===== -->
    <section id="view-ongoing" class="progress-section hidden">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <p class="progress-text" id="progress-text">
        <strong>0</strong> / 31일 (0%)
      </p>
    </section>

    <!-- ===== 성공 ===== -->
    <section id="view-success" class="success-section hidden">
      <div class="success-section__icon">&#127881;</div>
      <h2 class="success-section__title">금연 성공!</h2>
      <p class="success-section__desc">
        삼덕이, 31일을 완주했습니다. 삼루먼쇼는 없습니다!
      </p>
    </section>

    <!-- ===== 벌칙 카드 ===== -->
    <section id="penalty-section">
      <div class="penalty-card">
        <div class="penalty-card__ghost" aria-hidden="true">삼루먼쇼 삼루먼쇼 삼루먼쇼</div>
        <div class="penalty-card__label">실패 시 벌칙</div>
        <div class="penalty-card__name" data-text="삼루먼쇼">삼루먼쇼</div>
        <div class="penalty-card__warning" aria-hidden="true">도망칠 수 없다</div>
      </div>
    </section>

    <!-- ===== 타임라인 ===== -->
    <section class="timeline">
      <h2 class="timeline__title">31일 타임라인</h2>
      <div class="timeline__grid" id="timeline-grid">
        <!-- JS에서 렌더링 -->
      </div>
    </section>

    <!-- ===== 건강 회복 (후속 이슈 #4에서 채움) ===== -->
    <section id="health-section"></section>

    <!-- ===== 절약 금액 (후속 이슈 #4에서 채움) ===== -->
    <section id="savings-section"></section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p class="footer__cheer">삼덕아, 오늘도 한 개비 참았다. 내일도 파이팅!</p>
      <div class="footer__rules">
        <span>기간: 2026.05.13 ~ 2026.06.12 (31일)</span>
        <span>규칙: 한 개비라도 피우면 실패</span>
        <span>벌칙: 삼루먼쇼</span>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
